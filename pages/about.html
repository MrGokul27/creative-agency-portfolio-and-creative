<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>About Us - Stackly Creative Agency</title>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- FontAwesome 6 Latest -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../assets/css/styles.css" />
    <link rel="stylesheet" href="../assets/css/about.css" />
  </head>
  <body data-page="about" data-in-pages="true">
    <!-- Common Header Placeholder -->
    <div id="header-placeholder"></div>

    <!-- Main Content -->
    <main class="main-content">
      <!-- About Banner Section -->
      <section class="about-banner-section">
        <div class="container">
          <div class="row align-items-center g-4 g-lg-5">
            <!-- Left Column: Content -->
            <div class="col-12 col-lg-6">
              <div class="about-banner-content">
                <!-- Badge / Subtitle with line indicator -->
                <div class="about-banner-badge">
                  <span class="about-badge-line"></span>
                  <span class="about-badge-text">ABOUT US</span>
                </div>

                <!-- Main Title -->
                <h1 class="about-banner-title">
                  We are a <span class="gradient-text-purple">creative</span
                  ><br />
                  <span class="gradient-text-purple">agency</span> that turns
                  ideas<br />
                  into impactful brands.
                </h1>

                <!-- Description -->
                <p class="about-banner-desc">
                  We blend strategy,design and technology to create meaningful
                  digital experiences that help brands grow, connect and make a
                  difference.
                </p>

                <!-- CTA Button -->
                <div class="about-banner-cta">
                  <a href="#" class="btn btn-about-story">
                    <span>Watch Our Story</span>
                    <span class="btn-arrow-icon">
                      <i class="fa-solid fa-arrow-right"></i>
                    </span>
                  </a>
                </div>
              </div>
            </div>

            <!-- Right Column: Image with organic backdrop & doodle arrow -->
            <div class="col-12 col-lg-6">
              <div class="about-banner-media-wrapper">
                <!-- Main Image Card Container -->
                <div class="about-banner-img-card">
                  <img
                    src="../assets/images/about/about-banner-image.webp"
                    alt="Creative Agency Team - About Us"
                    class="about-banner-img"
                  />
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- Common Footer Placeholder -->
    <div id="footer-placeholder"></div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JS -->
    <script src="../assets/js/script.js"></script>
  </body>
</html>
